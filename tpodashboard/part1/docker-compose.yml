version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepvista
      POSTGRES_PASSWORD: prepvista_dev_pw
      POSTGRES_DB: prepvista_dev
    ports:
      - "5432:5432"
    volumes:
      - prepvista_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepvista -d prepvista_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://prepvista:prepvista_dev_pw@db:5432/prepvista_dev
      JWT_SECRET_KEY: dev-only-insecure-secret-change-me
      CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage/documents
    ports:
      - "8000:8000"
    volumes:
      - prepvista_storage:/app/storage
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  prepvista_pgdata:
  prepvista_storage:
