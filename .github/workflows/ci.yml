name: CI

# Fix 10 — regression suite gate.
# Runs the pure unit/regression suite (STT repair, question dedup, grounded
# better-answer, score-scale, resume parsing, audit trail, Redis memory cache)
# on every PR and on pushes to main. Coding also uses an isolated PostgreSQL service; no LLM — tests/conftest.py
# seeds dummy settings so app.config imports cleanly.
#
# To make this BLOCK merges: in GitHub → Settings → Branches → branch protection
# for `main`, mark the backend and frontend verification checks
# as required.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-runner-tests:
    name: Isolated runner contracts and WASM fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/coding-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/coding-runner/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  backend-tests:
    name: Backend regression suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prepvista_integration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Starlette 1.3 TestClient prefers the maintained httpx2 successor.
          # Keep it test-only; the application still uses httpx for provider SDKs.
          pip install pytest pip-audit httpx2==2.12.0

      - name: Compile backend
        run: python -m compileall -q app

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q
        env:
          CODING_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/prepvista_integration_test

      - name: Validate local unified release inventory and flag plan
        run: python -m scripts.unified_release_preflight --flags-file docs/architecture/unified-rollout.flags.example.json

      - name: Evaluate authored readiness policy fixtures without app access
        run: python -m scripts.evaluate_readiness_policy --policy docs/architecture/readiness-policy.candidate.json --fixtures docs/architecture/readiness-review.fixtures.example.json

      - name: Compare synthetic reviewer annotations without app access
        run: python -m scripts.evaluate_readiness_policy --policy docs/architecture/readiness-policy.candidate.json --fixtures docs/architecture/readiness-review.fixtures.example.json --reviews docs/architecture/readiness-reviewer-annotations.example.json --comparison-only

      - name: Replay authored readiness snapshot without app access
        run: python -m scripts.verify_readiness_snapshots --snapshot-file docs/architecture/readiness-snapshot.fixture.example.json

  frontend-verify:
    name: Frontend lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend regression tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Install browser for integration checks
        run: npx playwright install --with-deps chromium

      - name: Browser integration checks
        run: npm run test:e2e

  # Ported coding modules are verified by frontend-verify, and the separate
  # runner by isolated-runner-tests. The old CodeForge-AI root package no longer
  # exists; local reference snapshots are not a deployable CI workspace.
