name: CI

# Fix 10 — regression suite gate.
# Runs the pure unit/regression suite (STT repair, question dedup, grounded
# better-answer, score-scale, resume parsing, audit trail, Redis memory cache)
# on every PR and on pushes to main. No DB / network / LLM — tests/conftest.py
# seeds dummy settings so app.config imports cleanly.
#
# To make this BLOCK merges: in GitHub → Settings → Branches → branch protection
# for `main`, mark the backend and frontend verification checks
# as required.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Starlette 1.3 TestClient prefers the maintained httpx2 successor.
          # Keep it test-only; the application still uses httpx for provider SDKs.
          pip install pytest pip-audit httpx2==2.12.0

      - name: Compile backend
        run: python -m compileall -q app

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend-verify:
    name: Frontend lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
