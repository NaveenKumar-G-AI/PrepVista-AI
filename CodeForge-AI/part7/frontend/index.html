<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeForge — Assessment Workspace</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="brand">
      <span class="mark">CODEFORGE</span>
      <h1>Assessment Workspace</h1>
    </div>
    <div class="identity">
      <span>Sign in as</span>
      <input id="userIdInput" placeholder="user-id (uuid from seed-output.json)" />
      <select id="roleSelect">
        <option value="student">student</option>
        <option value="tpo">tpo</option>
      </select>
      <button class="secondary" id="signInBtn">Set identity</button>
    </div>
  </div>

  <div class="main">
    <div class="rail" id="rail">
      <h2>Your assessments</h2>
      <div id="assessmentList"><p class="muted">Sign in to see your assessments.</p></div>
      <div class="card" id="newAssessmentCard" style="display:none; margin-top:16px;">
        <h2 style="margin-bottom:8px;">Start something new</h2>
        <label class="muted" style="display:block; margin-bottom:4px;">Purpose</label>
        <input id="newPurpose" value="Determine Software Engineer readiness." style="width:100%; margin-bottom:8px; background:var(--bg-raised); border:1px solid var(--border); border-radius:6px; padding:6px 8px;" />
        <label class="muted" style="display:block; margin-bottom:4px;">Role ID</label>
        <input id="newRoleId" placeholder="role-id (uuid from seed-output.json)" style="width:100%; margin-bottom:8px; background:var(--bg-raised); border:1px solid var(--border); border-radius:6px; padding:6px 8px;" />
        <label class="muted" style="display:block; margin-bottom:4px;">Type</label>
        <select id="newType" style="width:100%; margin-bottom:10px; background:var(--bg-raised); border:1px solid var(--border); border-radius:6px; padding:6px 8px;">
          <option value="role_readiness">role_readiness</option>
          <option value="diagnostic">diagnostic</option>
          <option value="skill_verification">skill_verification</option>
        </select>
        <button class="primary" id="createBtn" style="width:100%;">Create assessment</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <h2>No assessment open</h2>
        <p class="muted">Sign in with a student ID from <code>scripts-output/seed-output.json</code>, then pick or start an assessment.</p>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
