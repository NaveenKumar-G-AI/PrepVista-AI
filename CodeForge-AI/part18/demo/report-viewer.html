<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeForge — Quality Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #0F1210;
    --paper: #ECE7D8;
    --paper-dim: #DCD6C2;
    --paper-line: #C9C1A6;
    --ink: #23261F;
    --ink-soft: #5B5A4E;
    --red: #A73B2B;
    --amber: #92651A;
    --slate: #3C5B66;
    --green: #3F6B45;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    background-image: radial-gradient(ellipse at top, #1A1E19 0%, #0F1210 60%);
    font-family: var(--sans);
    color: var(--paper);
    min-height: 100vh;
    padding: 48px 20px 80px;
  }
  .toolbar {
    max-width: 760px;
    margin: 0 auto 28px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7D8A78;
    margin: 0 auto 0 0;
    font-weight: 500;
  }
  button, textarea {
    font-family: var(--mono);
  }
  .btn {
    background: transparent;
    color: #B9C4B4;
    border: 1px solid #3A4038;
    padding: 7px 14px;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border-radius: 3px;
  }
  .btn:hover { border-color: #6B7A63; color: #ECE7D8; }
  .paste-panel {
    max-width: 760px;
    margin: 0 auto 24px;
    display: none;
  }
  .paste-panel.open { display: block; }
  .paste-panel textarea {
    width: 100%;
    height: 120px;
    background: #12140F;
    color: #B9C4B4;
    border: 1px solid #3A4038;
    border-radius: 3px;
    padding: 10px;
    font-size: 12px;
    resize: vertical;
  }

  /* --- the printout --- */
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    color: var(--ink);
    border-radius: 2px 2px 10px 10px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 2px 0 rgba(255,255,255,0.04) inset;
    position: relative;
    overflow: hidden;
  }
  .sheet::before {
    /* torn/perforated top edge */
    content: "";
    display: block;
    height: 10px;
    background-image: radial-gradient(circle at 8px 0px, transparent 5px, var(--desk) 5.5px);
    background-size: 16px 10px;
    background-position: -4px 0;
  }
  .sheet-inner { padding: 8px 40px 36px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 22px;
  }
  .masthead .brand {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .masthead .lang {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .grade-row {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 4px;
  }
  .grade-number {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .grade-number small { font-size: 24px; font-weight: 500; color: var(--ink-soft); }
  .grade-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    transform: rotate(-2deg);
  }
  .grade-EXCELLENT, .grade-GOOD { color: var(--green); }
  .grade-FAIR, .grade-NEEDS_IMPROVEMENT { color: var(--amber); }
  .grade-POOR, .grade-ANALYSIS_FAILED { color: var(--red); }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 28px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--paper-line); }

  table.dims { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
  table.dims td { padding: 5px 0; border-bottom: 1px dotted var(--paper-line); }
  table.dims td.name { color: var(--ink); }
  table.dims td.n { text-align: right; font-weight: 600; width: 50px; }
  table.dims td.bar { width: 45%; }
  .bar-track { height: 6px; background: var(--paper-dim); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ink); }

  ul.strengths { list-style: none; padding: 0; margin: 0; font-size: 14px; line-height: 1.9; }
  ul.strengths li::before { content: "✓ "; color: var(--green); font-weight: 700; }

  .finding {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dotted var(--paper-line);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .finding:last-child { border-bottom: none; }
  .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    height: fit-content;
    white-space: nowrap;
    margin-top: 1px;
  }
  .tag-CRITICAL, .tag-HIGH { background: var(--red); color: var(--paper); }
  .tag-MEDIUM { background: var(--amber); color: var(--paper); }
  .tag-LOW, .tag-INFO { background: var(--slate); color: var(--paper); }
  .finding .body b { display: block; }
  .finding .meta { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .finding .loc { font-family: var(--mono); color: var(--ink-soft); font-size: 11.5px; }

  .callout {
    margin-top: 28px;
    padding: 14px 16px;
    border: 1.5px solid var(--red);
    border-radius: 3px;
    position: relative;
    background: rgba(167,59,43,0.05);
  }
  .callout .stamp {
    position: absolute;
    top: -11px;
    left: 14px;
    background: var(--paper);
    padding: 0 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
  }
  .callout .why { color: var(--ink-soft); font-size: 12.5px; margin-top: 6px; }

  .footer-row {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid var(--paper-line);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .empty-note { color: var(--ink-soft); font-size: 13px; font-style: italic; }
</style>
</head>

    const $ = (sel) => document.querySelector(sel);

    function el(tag, className, children) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (children != null) {
        (Array.isArray(children) ? children : [children]).forEach((c) => {
          if (c == null) return;
          e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        });
      }
      return e;
    }

    function render(report) {
      const host = $('#sheetHost');
      host.innerHTML = '';

      const sheet = el('div', 'sheet');
      const inner = el('div', 'sheet-inner');
      sheet.appendChild(inner);

      // masthead
      inner.appendChild(el('div', 'masthead', [
        el('div', 'brand', 'CodeForge — Code Quality Analysis'),
        el('div', 'lang', [`${report.language}`, document.createElement('br'), `submission ${report.submissionId}`]),
      ]));

      // grade
      const gradeNum = el('div', 'grade-number', [report.overallScore != null ? String(report.overallScore) : '—', el('small', null, ' / 100')]);
      inner.appendChild(el('div', 'grade-row', [gradeNum, el('div', `grade-label grade-${report.overallLabel}`, report.overallLabel)]));
      inner.appendChild(el('div', 'empty-note', `analysis v${report.analysisVersion} · rules v${report.ruleSetVersion}${report.cacheHit ? ' · served from cache' : ''}`));

      // dimensions
      if (report.dimensionScores && report.dimensionScores.length) {
        inner.appendChild(el('div', 'section-label', 'Dimensions'));
        const table = el('table', 'dims');
        report.dimensionScores.forEach((d) => {
          const bar = el('div', 'bar-track', el('div', 'bar-fill'));
          bar.firstChild.style.width = Math.max(0, Math.min(100, d.score)) + '%';
          const row = el('tr', null, [
            el('td', 'name', d.dimension.replace(/_/g, ' ')),
            el('td', 'bar', bar),
            el('td', 'n', String(d.score)),
          ]);
          table.appendChild(row);
        });
        inner.appendChild(table);
      }

      // strengths
      if (report.positiveSignals && report.positiveSignals.length) {
        inner.appendChild(el('div', 'section-label', 'Strengths'));
        const ul = el('ul', 'strengths');
        report.positiveSignals.forEach((s) => ul.appendChild(el('li', null, s.title)));
        inner.appendChild(ul);
      }

      // findings
      inner.appendChild(el('div', 'section-label', `Findings (${report.findings ? report.findings.length : 0})`));
      if (!report.findings || report.findings.length === 0) {
        inner.appendChild(el('div', 'empty-note', 'No findings — nothing crossed an evidence or confidence threshold worth reporting.'));
      } else {
        report.findings.forEach((f) => {
          const loc = f.sourceLocation ? el('span', 'loc', ` L${f.sourceLocation.startLine}–${f.sourceLocation.endLine}`) : null;
          const body = el('div', 'body', [
            el('b', null, [f.title, loc]),
            el('span', null, f.description),
            el('div', 'meta', `${f.ruleId} · confidence ${f.confidence.toLowerCase()}`),
          ]);
          inner.appendChild(el('div', 'finding', [el('span', `tag tag-${f.severity}`, f.severity), body]));
        });
      }

      // most important improvement
      if (report.mostImportantImprovement) {
        inner.appendChild(el('div', 'callout', [
          el('span', 'stamp', 'Most important improvement'),
          el('div', null, report.mostImportantImprovement.title),
          el('div', 'why', report.mostImportantImprovement.why),
        ]));
      }

      // AI summary
      if (report.aiInterpretation) {
        inner.appendChild(el('div', 'section-label', `AI interpretation (${report.aiStatus.toLowerCase()})`));
        inner.appendChild(el('div', 'empty-note', report.aiInterpretation.summary));
      }

      // comparison
      if (report.comparison) {
        inner.appendChild(el('div', 'section-label', 'vs. previous submission'));
        const delta = report.comparison.delta;
        inner.appendChild(el('div', 'empty-note',
          `${report.comparison.previousScore} → ${report.comparison.currentScore}  (${delta > 0 ? '+' : ''}${delta})`));
      }

      inner.appendChild(el('div', 'footer-row', [
        el('span', null, `confidence: ${report.confidenceSummary.high}H / ${report.confidenceSummary.medium}M / ${report.confidenceSummary.low}L / ${report.confidenceSummary.unknown}U`),
        el('span', null, new Date(report.generatedAt).toISOString()),
      ]));

      host.appendChild(sheet);
    }

    $('#loadSampleBtn').addEventListener('click', () => render(SAMPLE_REPORT));
    $('#togglePasteBtn').addEventListener('click', () => $('#pastePanel').classList.toggle('open'));
    $('#renderPastedBtn').addEventListener('click', () => {
      try {
        render(JSON.parse($('#jsonInput').value));
      } catch (e) {
        alert('That is not valid JSON: ' + e.message);
      }
    });

    render(SAMPLE_REPORT);
  </script>
