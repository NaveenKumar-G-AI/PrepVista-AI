services:
  - type: web
    name: codeforge
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
