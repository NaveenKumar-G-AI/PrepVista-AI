services:
  # ─────────────────────────────────────────────
  # BACKEND WEB SERVICE  (unchanged)
  # ─────────────────────────────────────────────
  - type: web
    name: prepvista-backend
    env: docker
    plan: starter
    autoDeploy: true
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PREPVISTA_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        # NOTE: still unresolved from earlier review — "prepvistabeckend" (transposed)
        # vs "prepvistabackend" / "prepvistabackend1". Confirm which .onrender.com
        # host is actually live before trusting either one in the heartbeat below.
        value: prepvista.ai,www.prepvista.ai,prepvistaai.com,www.prepvistaai.com,prepvistabeckend.onrender.com,prepvistabackend.onrender.com,prepvistabackend1.onrender.com,prepvista-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://prepvista.ai,https://www.prepvista.ai,https://prepvistaai.com,https://www.prepvistaai.com,https://prepvista-ai.vercel.app,https://prepvista-p1vo.onrender.com
      - key: SECURE_HEADERS_ENABLED
        value: "true"
      - key: MAX_REQUEST_SIZE_MB
        value: "10"
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OFFER_DOCUMENT_BUCKET
        value: offer-documents
      - key: OFFER_DOCUMENT_MAX_MB
        value: "8"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STT_SERVER_ENABLED
        sync: false
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      - key: INTERVIEW_AUDIO_BUCKET
        value: interview-audio
      - key: AUDIO_RETENTION_DAYS
        value: "90"
      - key: ADMIN_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # ⚠️ Supabase session-mode pooler is capped at 15 client connections.
      # Total live connections = WEB_CONCURRENCY (worker processes) × DB_POOL_MAX_SIZE,
      # because EACH gunicorn worker opens its OWN asyncpg pool. The old
      # 2 × 20 = 40 guaranteed EMAXCONNSESSION ("max clients reached in session
      # mode - pool_size: 15"). The app is async/I-O-bound, so a single worker
      # serves high concurrency via the event loop — 1 worker × 10 = 10 keeps us
      # safely under 15 with headroom for the migration conn and deploy overlap.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MIN_SIZE
        value: "2"
      - key: DB_POOL_MAX_SIZE
        value: "10"

  # ─────────────────────────────────────────────
  # PRIMARY HEARTBEAT  — fires at :03 :08 :13 … :58
  # Pings BOTH backend + frontend every 5 min.
  # Up to 3 reset "stages", 6 rounds/stage, exponential
  # backoff + jitter, parallel URL racing, per-request
  # abort timeout. Hard-capped at ~2.5min wall-clock so
  # a run never delays its own next scheduled trigger
  # (Render queues rather than overlaps cron runs).
  # Optional webhook alert on final failure.
  # ─────────────────────────────────────────────
  - type: cron
    name: prepvista-heartbeat-primary
    runtime: node
    plan: starter
    autoDeploy: true
    schedule: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
    buildCommand: echo "PrepVista heartbeat v4 primary ready"
    startCommand: >-
      node -e "
      const bBase=(process.env.BACKEND_HEARTBEAT_BASE_URL||'https://prepvistabeckend.onrender.com').replace(/\/$/,'');
      const fBase=(process.env.FRONTEND_HEARTBEAT_BASE_URL||'https://prepvistaai.com').replace(/\/$/,'');
      const bUrls=[bBase+'/health/awake',bBase+'/health/ready',bBase+'/health',bBase+'/'];
      const fUrls=fBase?[fBase+'/',fBase+'/api/health',fBase+'/ping']:[];
      const hdrs={'x-prepvista-awake':'1','x-prepvista-awake-source':'render-cron-primary','user-agent':'PrepVistaHeartbeat/4.0','accept':'application/json,text/html,*/*','cache-control':'no-cache'};
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      const jitter=ms=>ms+Math.floor(Math.random()*(ms*0.2));
      const ping=async(url,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{headers:hdrs,signal:c.signal,redirect:'follow'});clearTimeout(t);return{url,ok:r.ok||r.status===301||r.status===302,status:r.status};}catch(e){clearTimeout(t);return{url,ok:false,err:e.message};}};
      const pingAny=async(label,urls,ms)=>{if(!urls.length)return true;const res=await Promise.allSettled(urls.map(u=>ping(u,ms)));const hit=res.find(r=>r.status==='fulfilled'&&r.value.ok);if(hit)console.log('['+label+'] alive via '+hit.value.url+' ('+hit.value.status+')');else res.forEach(r=>{if(r.status==='fulfilled')console.log('['+label+'] miss '+r.value.url+' '+(r.value.err||r.value.status));});return!!hit;};
      (async()=>{
      const STARTED=Date.now();
      const MAX_TOTAL_MS=parseInt(process.env.HEARTBEAT_MAX_TOTAL_MS||'150000',10);
      const MAX_STAGES=parseInt(process.env.HEARTBEAT_MAX_STAGES||'3',10);
      const ROUNDS=6;
      let bOk=false,fOk=!fUrls.length,stage=1;
      outer:
      while(stage<=MAX_STAGES){
      console.log('=== STAGE '+stage+'/'+MAX_STAGES+' ===');
      for(let i=1;i<=ROUNDS;i++){
      if(Date.now()-STARTED>=MAX_TOTAL_MS){console.log('time budget hit, stopping');break outer;}
      console.log('['+new Date().toISOString()+'] stage='+stage+' round='+i+'/'+ROUNDS+' backend='+bOk+' frontend='+fOk);
      const tout=Math.min(20000,9000+(i*1500));
      if(!bOk)bOk=await pingAny('BACKEND',bUrls,tout);
      if(!fOk)fOk=await pingAny('FRONTEND',fUrls,tout);
      if(bOk&&fOk){console.log('ALL SERVICES ALIVE - exit 0');process.exit(0);}
      if(i<ROUNDS){const d=jitter(Math.min(45000,5500*Math.pow(1.65,i-1)));console.log('retry in '+Math.round(d/1000)+'s');await sleep(d);}
      }
      stage++;
      if(stage<=MAX_STAGES&&Date.now()-STARTED<MAX_TOTAL_MS){console.log('stage exhausted — resetting, trying again');await sleep(jitter(5000));}
      }
      const allOk=bOk&&fOk;
      console[allOk?'log':'error']('heartbeat end backend='+bOk+' frontend='+fOk+' stages_used='+Math.min(stage,MAX_STAGES));
      if(!allOk){
      const hook=process.env.ALERT_WEBHOOK_URL;
      if(hook){try{await fetch(hook,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'⚠️ PrepVista heartbeat FAILED after '+Math.min(stage,MAX_STAGES)+' stage(s) — backend='+bOk+' frontend='+fOk})});}catch(e){console.error('alert webhook failed:',e.message);}}
      }
      process.exit(allOk?0:1);
      })();"
    envVars:
      - key: BACKEND_HEARTBEAT_BASE_URL
        value: https://prepvistabeckend.onrender.com
      - key: FRONTEND_HEARTBEAT_BASE_URL
        value: https://prepvistaai.com
      - key: HEARTBEAT_MAX_STAGES
        value: "3"
      - key: HEARTBEAT_MAX_TOTAL_MS
        value: "150000"
      - key: ALERT_WEBHOOK_URL
        sync: false

  # ─────────────────────────────────────────────
  # BACKUP HEARTBEAT  — fires at :01 :06 :11 … :56
  # Offset +2 min from primary → effective coverage
  # every ~2-3 min. Identical staged-retry logic.
  # ─────────────────────────────────────────────
  - type: cron
    name: prepvista-heartbeat-backup
    runtime: node
    plan: starter
    autoDeploy: true
    schedule: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    buildCommand: echo "PrepVista heartbeat v4 backup ready"
    startCommand: >-
      node -e "
      const bBase=(process.env.BACKEND_HEARTBEAT_BASE_URL||'https://prepvistabeckend.onrender.com').replace(/\/$/,'');
      const fBase=(process.env.FRONTEND_HEARTBEAT_BASE_URL||'https://prepvistaai.com').replace(/\/$/,'');
      const bUrls=[bBase+'/health/awake',bBase+'/health/ready',bBase+'/health',bBase+'/'];
      const fUrls=fBase?[fBase+'/',fBase+'/api/health',fBase+'/ping']:[];
      const hdrs={'x-prepvista-awake':'1','x-prepvista-awake-source':'render-cron-backup','user-agent':'PrepVistaHeartbeat/4.0','accept':'application/json,text/html,*/*','cache-control':'no-cache'};
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      const jitter=ms=>ms+Math.floor(Math.random()*(ms*0.2));
      const ping=async(url,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{headers:hdrs,signal:c.signal,redirect:'follow'});clearTimeout(t);return{url,ok:r.ok||r.status===301||r.status===302,status:r.status};}catch(e){clearTimeout(t);return{url,ok:false,err:e.message};}};
      const pingAny=async(label,urls,ms)=>{if(!urls.length)return true;const res=await Promise.allSettled(urls.map(u=>ping(u,ms)));const hit=res.find(r=>r.status==='fulfilled'&&r.value.ok);if(hit)console.log('['+label+'] alive via '+hit.value.url+' ('+hit.value.status+')');else res.forEach(r=>{if(r.status==='fulfilled')console.log('['+label+'] miss '+r.value.url+' '+(r.value.err||r.value.status));});return!!hit;};
      (async()=>{
      const STARTED=Date.now();
      const MAX_TOTAL_MS=parseInt(process.env.HEARTBEAT_MAX_TOTAL_MS||'150000',10);
      const MAX_STAGES=parseInt(process.env.HEARTBEAT_MAX_STAGES||'3',10);
      const ROUNDS=6;
      let bOk=false,fOk=!fUrls.length,stage=1;
      outer:
      while(stage<=MAX_STAGES){
      console.log('=== STAGE '+stage+'/'+MAX_STAGES+' ===');
      for(let i=1;i<=ROUNDS;i++){
      if(Date.now()-STARTED>=MAX_TOTAL_MS){console.log('time budget hit, stopping');break outer;}
      console.log('['+new Date().toISOString()+'] stage='+stage+' round='+i+'/'+ROUNDS+' backend='+bOk+' frontend='+fOk);
      const tout=Math.min(20000,9000+(i*1500));
      if(!bOk)bOk=await pingAny('BACKEND',bUrls,tout);
      if(!fOk)fOk=await pingAny('FRONTEND',fUrls,tout);
      if(bOk&&fOk){console.log('ALL SERVICES ALIVE - exit 0');process.exit(0);}
      if(i<ROUNDS){const d=jitter(Math.min(45000,5500*Math.pow(1.65,i-1)));console.log('retry in '+Math.round(d/1000)+'s');await sleep(d);}
      }
      stage++;
      if(stage<=MAX_STAGES&&Date.now()-STARTED<MAX_TOTAL_MS){console.log('stage exhausted — resetting, trying again');await sleep(jitter(5000));}
      }
      const allOk=bOk&&fOk;
      console[allOk?'log':'error']('heartbeat end backend='+bOk+' frontend='+fOk+' stages_used='+Math.min(stage,MAX_STAGES));
      if(!allOk){
      const hook=process.env.ALERT_WEBHOOK_URL;
      if(hook){try{await fetch(hook,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'⚠️ PrepVista heartbeat FAILED after '+Math.min(stage,MAX_STAGES)+' stage(s) — backend='+bOk+' frontend='+fOk})});}catch(e){console.error('alert webhook failed:',e.message);}}
      }
      process.exit(allOk?0:1);
      })();"
    envVars:
      - key: BACKEND_HEARTBEAT_BASE_URL
        value: https://prepvistabeckend.onrender.com
      - key: FRONTEND_HEARTBEAT_BASE_URL
        value: https://prepvistaai.com
      - key: HEARTBEAT_MAX_STAGES
        value: "3"
      - key: HEARTBEAT_MAX_TOTAL_MS
        value: "150000"
      - key: ALERT_WEBHOOK_URL
        sync: false
